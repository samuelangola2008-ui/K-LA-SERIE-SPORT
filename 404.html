<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página no encontrada | K SPORT</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .error-page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 2rem; }
  .error-code{ font-family: var(--font-display); font-size: clamp(4rem,16vw,8rem); background: var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1; }
  .error-title{ font-size: 1.4rem; margin: .5rem 0 1.5rem; text-transform:uppercase; }
</style>
</head>
<body>
  <main class="error-page">
    <p class="error-code">404</p>
    <h1 class="error-title">Página no encontrada</h1>
    <p>El par que buscas no está por aquí. Vuelve al inicio y sigue explorando.</p>
    <a class="btn btn-primary" href="/index.html">🛒 Volver a la tienda</a>
  </main>
</body>
</html>
